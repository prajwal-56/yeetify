<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeetify | YEET ! Your files </title>

    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <h1> yeet !</h1>
    <img src="attachments/yeet-skit.gif" alt="Timothe and someone else SNL - yeet.gif">

    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file"> 
        <button type="submit"> YEET ! </button>

    </form>

    <div id="file-list">

    </div>

    <script>

    // web socket things
    const socket = new WebSocket(`ws://${window.location.host}/websocket`); // init handhsake - to form a socket with the server and stays open
    socket.onmessage = (msg) => {
        if(msg.data === "new_file_appeared" || msg.data == "file_removed"){
            render_file_list();
        } else if( msg.data === "yeet"){
            // broadcast_yeet(); // - just pings everyone or notify or something to every clients
        }
    }


    async function delete_file(filename , file_in_list){

        const confirmation = confirm ("Do you really wanna delete this file ? " + filename)

        // proceed with removing/deleting the file
        if (confirmation){
            
            const response = await fetch(`/delete/${filename}` , {
                method: `DELETE`,
            })
    
            if(response.ok) file_in_list.remove();
        } 
    }

    async function render_file_list(){
            const response = await fetch("/files")
            const response_json = await response.json()

            console.log(response_json)

            const fileList_container = document.getElementById('file-list');
            fileList_container.innerHTML = "";

            const files_ul = document.createElement('ul');

            response_json.forEach(filename => {
                const li = document.createElement('li');
                const link = document.createElement('a');
                const rm_btn = document.createElement('button');

                link.href = `/download/${filename}`;
                link.textContent = filename;
                link.setAttribute('download' , filename);

                rm_btn.innerHTML = `Remove`;
                rm_btn.className="remove-file-btn";
                rm_btn.onclick = () => delete_file( filename , li )

                li.append(link);
                li.append(rm_btn);
                files_ul.append(li)
            });

            fileList_container.append(files_ul);
        }

        render_file_list();
    </script>
</body>
</html>
